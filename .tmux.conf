# remap prefix from 'C-b' to 'C-b'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# reload config
unbind r
bind r source-file ~/.tmux.conf

# vim mode
setw -g mode-keys vi

# prompt window name when creating a new one
bind-key c command-prompt -p "window name:" "new-window; rename-window '%%'"

# project picker
bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"
# open lazygit in a popup window
bind-key g popup -E -w 90% -h 90%  -d '#{pane_current_path}' lazygit

# color support
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# enable mouse scrolling - shift click to highlight text
set -g mouse on


# theme
# Message style.
set -g message-style "fg=yellow,bg=black"
set -g message-command-style "fg=yellow,bg=black"

# Command prompt cursor color.
set -g prompt-cursor-colour "#EEF1F8"

# Pane style.
set -g pane-border-style 'fg=black'
set -g pane-active-border-style "fg=black"
set-window-option -g pane-border-status off

# Status style.
set -g status-style "fg=yellow,bg=#232831"
set -g status-left " "
set -g status-right "#[fg=colour8,bg=default] #S #[fg=green,bg=default]"
set -g status-left-length 100
set -g status-position bottom
set -g status-justify left

# Window style.
set -g window-status-style "fg=colour8,bg=default"
set -g window-status-format "#[fg=default,bg=default] #[fg=default,bg=default]#W"
set -g window-status-separator "  "
set -g window-status-current-format "#[fg=cyan,bg=default] #[fg=cyan,bg=default]#W"
